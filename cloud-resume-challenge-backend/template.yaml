AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  cloud-resume-challenge-backend

  Sample SAM Template for cloud-resume-challenge-backend

Globals:
  Function:
    Timeout: 3

Parameters:
  StreamName:
    Type: String
    Description: Name of the Data Firehose that broadcasts visitor logs
    Default: 'cloud-resume-visitor-log-stream'
  PipeName:
    Type: String
    Description: Name of the EventBridge Pipe that consumes the visitor logs
    Default: 'cloud-resume-visitor-log-pipe'
  TableName:
    Type: String
    Description: Name of the Dynamo DB table that holds the transformed visitor logs
    Default: 'cloud-resume-visitor-logs'

Resources:
  Stream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Ref StreamName
      StreamModeDetails:
        StreamMode: ON_DEMAND

  PipeEnrichFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: enrich_pipe_event/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64

  StreamWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - kinesis:PutRecord
              Resource: !GetAtt Stream.Arn
      CodeUri: write_to_stream/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /log
            Method: post

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      AttributeDefinitions:
        - AttributeName: ID
          AttributeType: S
        - AttributeName: Epoch
          AttributeType: N
      KeySchema:
        - AttributeName: ID
          KeyType: HASH
        - AttributeName: Epoch
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  DynamoWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
              Resource: !GetAtt Table.Arn
      CodeUri: write_to_dynamo/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64

  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SourcePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:DescribeStream
                  - kinesis:DescribeStreamSummary
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - kinesis:ListShards
                  - kinesis:SubscribeToShard
                Resource: !GetAtt Stream.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt PipeEnrichFunction.Arn
                  - !GetAtt DynamoWriteFunction.Arn

  Pipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Ref PipeName
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt Stream.Arn
      SourceParameters:
        KinesisStreamParameters:
          BatchSize: 100
          StartingPosition: LATEST
          MaximumRetryAttempts: 3
      Target: !GetAtt DynamoWriteFunction.Arn
      Enrichment: !GetAtt PipeEnrichFunction.Arn

Outputs:
  StreamName:
    Description: Kinesis Stream name
    Value: !Ref StreamName
  StreamArn:
    Description: Kinesis Stream ARN
    Value: !GetAtt Stream.Arn

  PipeName:
    Description: EventBridge Pipe name
    Value: !Ref PipeName
  PipeArn:
    Description: EventBridge Pipe ARN
    Value: !GetAtt Pipe.Arn

  TableName:
    Description: DynamoDB Table name
    Value: !Ref TableName
  TableArn:
    Description: DynamoDB Table ARN
    Value: !GetAtt Table.Arn
