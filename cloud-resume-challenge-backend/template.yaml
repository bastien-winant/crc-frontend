AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  cloud-resume-challenge-backend

  Sample SAM Template for cloud-resume-challenge-backend

Globals:
  Function:
    Timeout: 3

Parameters:
  DeliveryStreamName:
    Type: String
    Description: Name of the Data Firehose that broadcasts visitor logs
    Default: 'cloud-resume-visitor-log-stream'
  EventBridgePipeName:
    Type: String
    Description: Name of the EventBridge Pipe that consumes the visitor logs
    Default: 'cloud-resume-visitor-log-pipe'
  DynamoDBTableName:
    Type: String
    Description: Name of the Dynamo DB table that holds the transformed visitor logs
    Default: 'cloud-resume-visitor-logs'

Resources:
  Bucket:
    Type: AWS::S3::Bucket

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      AttributeDefinitions:
        - AttributeName: ID
          AttributeType: S
        - AttributeName: Epoch
          AttributeType: N
      KeySchema:
        - AttributeName: ID
          KeyType: HASH
        - AttributeName: Epoch
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # IAM Role for the bucket cleanup Lambda function
  EmptyBucketRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EmptyBucketPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt Bucket.Arn
                  - !Sub ${Bucket.Arn}/*

  # Lambda function to empty the S3 bucket before deletion
  EmptyBucketFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt EmptyBucketRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def handler(event, context):
            bucket = event['ResourceProperties']['BucketName']
            if event['RequestType'] == 'Delete':
              s3 = boto3.resource('s3')
              bucket_resource = s3.Bucket(bucket)
              bucket_resource.objects.all().delete()
            cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

  # Custom resource to trigger bucket cleanup on stack deletion
  EmptyBucketOnDelete:
    Type: Custom::EmptyBucket
    Properties:
      ServiceToken: !GetAtt EmptyBucketFunction.Arn
      BucketName: !Ref Bucket

  # Data Firehose stream to transform and deliver the log data to S3
  DeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Ref DeliveryStreamName
      DeliveryStreamType: DirectPut

  # Lambda function to send raw API request data to Data Firehose stream
  EventToFirehoseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - firehose:PutRecord
              Resource: !GetAtt DeliveryStream.Arn
      CodeUri: event_to_firehose/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /log
            Method: post

  # Lambda function to write visitor logs to Dynamo DB
  DynamoUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - firehose:PutRecord
              Resource: !GetAtt DeliveryStream.Arn
      CodeUri: s3_to_dynamo/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64

  # Lambda function to enrich incoming source data
  EventEnrichmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: event_enrichment/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64

  EventBridgePipeRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: SourcePermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:GetRecords
                  - kinesis:ListShards
                  - kinesis:GetShardIterator
                Resource: !GetAtt DeliveryStream.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt EventEnrichmentFunction.Arn

  EventBridgePipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Ref EventBridgePipeName
      RoleArn: !GetAtt EventBridgePipeRole.Arn
      Enrichment: !GetAtt EventEnrichmentFunction.Arn
      Source: !GetAtt DeliveryStream.Arn
      Target: !GetAtt DynamoUploadFunction.Arn

Outputs:
  BucketName:
    Description: Data bucket name
    Value: !Ref Bucket
  BucketArn:
    Description: Data bucket ARN
    Value: !GetAtt Bucket.Arn

  DeliveryStreamName:
    Description: Kinesis Data Firehose delivery stream name
    Value: !Ref DeliveryStream
  DeliveryStreamArn:
    Description: Kinesis Data Firehose delivery stream ARN
    Value: !GetAtt DeliveryStream.Arn

  EventToFirehoseApi:
    Description: "API Gateway endpoint URL for Prod stage for Event To Firehose function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/log/"
  EventToFirehoseFunction:
    Description: "Event To Firehose Lambda Function ARN"
    Value: !GetAtt EventToFirehoseFunction.Arn